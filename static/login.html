<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 小说扩写助手</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1020;
            --panel: rgba(20, 28, 52, 0.86);
            --panel-strong: rgba(30, 41, 72, 0.92);
            --text: #f7f1df;
            --muted: #a9b1c7;
            --line: rgba(255, 255, 255, 0.12);
            --accent: #f2c66d;
            --accent-2: #71d6c7;
            --danger: #ff7b8b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 16% 16%, rgba(242, 198, 109, 0.22), transparent 28rem),
                radial-gradient(circle at 84% 28%, rgba(113, 214, 199, 0.18), transparent 24rem),
                linear-gradient(135deg, #090d18, var(--bg) 58%, #10172a);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .login-shell {
            width: min(100%, 960px);
            display: grid;
            grid-template-columns: 1.08fr 0.92fr;
            border: 1px solid var(--line);
            border-radius: 28px;
            overflow: hidden;
            background: var(--panel);
            box-shadow: 0 26px 90px rgba(0, 0, 0, 0.42);
            backdrop-filter: blur(18px);
        }

        .brand-panel {
            padding: 46px;
            min-height: 560px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background:
                linear-gradient(145deg, rgba(242, 198, 109, 0.14), rgba(113, 214, 199, 0.06)),
                var(--panel-strong);
            position: relative;
            overflow: hidden;
        }

        .brand-panel::after {
            content: "";
            position: absolute;
            width: 280px;
            height: 280px;
            right: -90px;
            bottom: -90px;
            border-radius: 50%;
            border: 1px solid rgba(242, 198, 109, 0.22);
            background: radial-gradient(circle, rgba(242, 198, 109, 0.12), transparent 62%);
        }

        .logo-mark {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--accent), #f59e0b);
            color: #172033;
            font-size: 28px;
            font-weight: 900;
            box-shadow: 0 12px 28px rgba(242, 198, 109, 0.24);
        }

        h1 {
            margin: 34px 0 14px;
            font-size: clamp(34px, 5vw, 58px);
            line-height: 0.98;
            letter-spacing: -0.05em;
        }

        .brand-panel p {
            max-width: 440px;
            margin: 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.75;
        }

        .status-chip {
            width: fit-content;
            padding: 10px 14px;
            border: 1px solid rgba(113, 214, 199, 0.28);
            border-radius: 999px;
            color: var(--accent-2);
            background: rgba(113, 214, 199, 0.08);
            font-size: 13px;
            font-weight: 700;
            z-index: 1;
        }

        .form-panel {
            padding: 46px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(8, 12, 24, 0.32);
        }

        .form-title {
            margin: 0 0 8px;
            font-size: 28px;
            letter-spacing: -0.03em;
        }

        .form-subtitle {
            margin: 0 0 30px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            color: #d6ddf3;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 0 15px;
            background: rgba(255, 255, 255, 0.055);
            color: var(--text);
            outline: none;
            font-size: 16px;
            transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        input:focus {
            border-color: rgba(242, 198, 109, 0.78);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(242, 198, 109, 0.12);
        }

        .error {
            display: none;
            margin: 0 0 18px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 123, 139, 0.28);
            background: rgba(255, 123, 139, 0.1);
            color: var(--danger);
            font-size: 13px;
            line-height: 1.5;
        }

        body.login-error .error {
            display: block;
        }

        button {
            width: 100%;
            height: 52px;
            margin-top: 26px;
            border: 0;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--accent), #f59e0b);
            color: #151b2c;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 16px 34px rgba(242, 198, 109, 0.22);
        }

        .hint {
            margin-top: 18px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.65;
        }

        @media (max-width: 760px) {
            body {
                padding: 14px;
                align-items: stretch;
            }

            .login-shell {
                grid-template-columns: 1fr;
                border-radius: 22px;
            }

            .brand-panel {
                min-height: 280px;
                padding: 30px 24px;
            }

            .form-panel {
                padding: 30px 24px 34px;
            }
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <section class="brand-panel">
            <div>
                <div class="logo-mark">✍</div>
                <h1>小说扩写助手</h1>
                <p>输入访问密码后进入工作台。登录状态会保存在浏览器 Cookie 中，账号密码可由浏览器密码管理器保存。</p>
            </div>
            <div class="status-chip">Private workspace</div>
        </section>

        <section class="form-panel">
            <h2 class="form-title">登录</h2>
            <p class="form-subtitle">使用站点访问账号继续访问。</p>
            <div class="error">账号或密码不正确，请重新输入。</div>
            <form method="post" action="/api/login" autocomplete="on">
                <input type="hidden" name="next" id="next" value="/">
                <label for="username">账号</label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus>
                <label for="password">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">进入工作台</button>
            </form>
            <p class="hint">这是普通网页登录表单，不是浏览器 Basic Auth 弹窗，因此 Safari/Chrome 可以保存密码。</p>
        </section>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error')) document.body.classList.add('login-error');
        const next = params.get('next');
        if (next && next.startsWith('/') && !next.startsWith('//')) {
            document.getElementById('next').value = next;
        }
    </script>
</body>
</html>
